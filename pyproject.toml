[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openshadow"
version = "0.1.0"
description = "OpenShadow Phase 0-1 reference implementation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "PyJWT>=2.9,<3",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = [
  "packages/shadow-kernel/src",
  "packages/shadow-application/src",
  "adapters/test-deterministic/src",
  "adapters/store-sqlite/src",
  "apps/shadow-server",
  "adapters/hermes-agent/src",
  "adapters/codex-agent/src",
]
include = ["shadow_kernel*", "shadow_application*", "shadow_adapters*", "shadow_store*", "shadow_server*", "shadow_hermes*", "shadow_codex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/shadow-kernel/src",
  "packages/shadow-application/src",
  "adapters/test-deterministic/src",
  "adapters/store-sqlite/src",
  "apps/shadow-server",
  "adapters/hermes-agent/src",
  "adapters/codex-agent/src",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
