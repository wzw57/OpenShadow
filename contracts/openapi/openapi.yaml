openapi: 3.1.0
info:
  title: OpenShadow Phase 0-1 API
  version: 0.1.0-stage4
  description: Accepted Stage 4 API contract implemented by the Stage 5 Phase 0-1 reference slice.
servers:
  - url: http://127.0.0.1:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Process health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: readiness
      security: []
      responses:
        "200":
          description: Ready for durable work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/Unavailable"
  /metrics:
    get:
      operationId: metrics
      security: []
      description: Low-cardinality Prometheus text metrics; no user or secret fields.
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /v1/auth/config:
    get:
      operationId: authConfig
      security: []
      description: Non-secret authentication mode and enabled methods.
      responses:
        "200":
          description: Authentication configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfigResponse"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      responses:
        "200":
          description: Verified session context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionContextResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createAuthSession
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthSessionCommand"
      responses:
        "201":
          description: Session created; token is returned only at exchange time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/auth/logout:
    post:
      operationId: logoutAuthSession
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/runtime:
    get:
      operationId: runtimeStatus
      description: Non-secret runtime descriptor and optional provider health for local clients.
      responses:
        "200":
          description: Runtime status
          content:
            application/json:
              schema:
                type: object
                required: [runtime]
                properties:
                  runtime:
                    type: object
                    required: [status, target_kind, descriptor]
                    properties:
                      status:
                        type: string
                        enum: [configured, healthy, unavailable]
                      target_kind:
                        type: string
                      descriptor:
                        type: object
                        additionalProperties: true
                      health:
                        type: object
                        nullable: true
                        additionalProperties: true
  /v1/management/overview:
    get:
      operationId: managementOverview
      description: Non-secret project and Runtime management overview.
      responses:
        "200":
          description: Management overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagementOverviewResponse"
  /v1/runtime/instances:
    get:
      operationId: listRuntimeInstances
      responses:
        "200":
          description: Runtime instances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeInstancesResponse"
  /v1/runtime/instances/{runtime_id}/start:
    post:
      operationId: startRuntime
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Runtime start accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMutationResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/runtime/instances/{runtime_id}/stop:
    post:
      operationId: stopRuntime
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Runtime stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMutationResponse"
  /v1/runtime/instances/{runtime_id}/restart:
    post:
      operationId: restartRuntime
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Runtime restart accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMutationResponse"
  /v1/runtime/instances/{runtime_id}/select:
    post:
      operationId: selectRuntime
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Runtime selected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMutationResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/runtime/instances/{runtime_id}/health:
    get:
      operationId: runtimeHealth
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMutationResponse"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/runtime/instances/{runtime_id}/probe:
    post:
      operationId: runtimeProbe
      parameters:
        - $ref: "#/components/parameters/RuntimeId"
      responses:
        "200":
          description: Runtime probe result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeMutationResponse"
  /v1/conversations:
    post:
      operationId: createConversation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationCommand"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: listConversations
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Conversation page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
  /v1/conversations/{conversation_id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: getConversation
      responses:
        "200":
          description: Conversation snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      operationId: listConversationMessages
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Ordered Message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/conversations/{conversation_id}/turns:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      operationId: submitConversationTurn
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationTurnSubmission"
      responses:
        "202":
          description: Accepted durable work
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAcceptedNew"
        "200":
          description: Exact idempotent replay of an existing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAcceptedReplay"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admissions/{admission_id}:
    parameters:
      - $ref: "#/components/parameters/AdmissionId"
    get:
      operationId: getAdmission
      responses:
        "200":
          description: Admission record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/requests/{request_id}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getRequest
      responses:
        "200":
          description: Immutable accepted Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      responses:
        "200":
          description: Canonical Run snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run_id}/events:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: streamRunEvents
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
            maxLength: 1000
      responses:
        "200":
          description: Recoverable SSE projection. Disconnecting does not cancel the Run.
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Cursor expired; retrieve the current Run snapshot and reconnect.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ShadowError"
  /v1/runs/{run_id}/cancel:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: requestRunCancellation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunCommand"
      responses:
        "202":
          description: Cancellation requested; this is not cancellation confirmation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/runs/{run_id}/retry:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: retryRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Retry accepted and appended as a new Attempt on the existing Run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkAccepted"
        "409":
          $ref: "#/components/responses/Conflict"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/memories:
    get:
      operationId: listMemories
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active Memory page by default
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
    post:
      operationId: createMemory
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCommand"
      responses:
        "201":
          description: User-authored Memory committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /v1/memories/{memory_id}:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    get:
      operationId: getMemory
      responses:
        "200":
          description: Current Memory Head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: logicallyDeleteMemory
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "202":
          description: Logical deletion committed as a new Canonical version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/memories/{memory_id}/corrections:
    parameters:
      - $ref: "#/components/parameters/MemoryId"
    post:
      operationId: correctMemory
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryCommand"
      responses:
        "200":
          description: New immutable Memory version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/states:
    get:
      operationId: listStates
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
        - name: state_key
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active State heads with computed freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/states/{state_id}:
    parameters:
      - $ref: "#/components/parameters/StateId"
    get:
      operationId: getState
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Current State head with computed freshness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks:
    get:
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Durable Task heads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{task_id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Durable Task head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/tasks/{task_id}/checkpoints:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: createTaskCheckpoint
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckpointCommand"
      responses:
        "200":
          description: Checkpoint and updated Task committed atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/tasks/{task_id}/completion:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      operationId: completeTask
      parameters:
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionCommand"
      responses:
        "200":
          description: Completion Proposal accepted and Task committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/actions:
    get:
      operationId: listActions
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Action heads isolated by Owner and Space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/actions/{action_id}:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    get:
      operationId: getAction
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Action head
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/extensions:
    get:
      operationId: listExtensions
      description: List registered Profile, Runtime and Contract extensions.
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Extension descriptors visible to the composition root
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionListResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/records:
    get:
      operationId: listGenericRecords
      description: Query canonical records through the generic extension-neutral read boundary.
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
        - name: record_type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: record_state
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Canonical records isolated by Owner and Space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/records/{record_id}:
    parameters:
      - name: record_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/StableId"
    get:
      operationId: getGenericRecord
      description: Read a canonical record through the generic extension-neutral boundary.
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Canonical record visible in the caller context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/inputs:
    post:
      operationId: submitGenericInput
      description: Submit a namespaced input resolved by the composition-time InputHandlerRegistry.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericInputPayload"
      responses:
        "202":
          description: Input accepted and committed by its registered handler
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/proposals:
    get:
      operationId: listProposals
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pending reviewable proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordPage"
    post:
      operationId: submitProposal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/StateProposalCommand"
                - $ref: "#/components/schemas/TaskProposalCommand"
                - $ref: "#/components/schemas/ActionProposalCommand"
                - $ref: "#/components/schemas/ActionApprovalProposalCommand"
      responses:
        "202":
          description: State Proposal accepted for explicit Commit decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/proposals/{proposal_id}:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    get:
      operationId: getProposal
      responses:
        "200":
          description: Restricted Proposal control record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRecordResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/proposals/{proposal_id}/accept:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: acceptProposal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
      responses:
        "200":
          description: Proposal decision and resulting record references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDecisionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/proposals/{proposal_id}/reject:
    parameters:
      - $ref: "#/components/parameters/ProposalId"
    post:
      operationId: rejectProposal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "200":
          description: Proposal rejected without creating a domain asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalDecisionResponse"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/endpoints/pair:
    post:
      operationId: pairEndpoint
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointPairCommand"
      responses:
        "201": { description: Endpoint paired }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/endpoints:
    get:
      operationId: listEndpoints
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
      responses:
        "200": { $ref: "#/components/responses/RecordPage" }
  /v1/endpoints/{endpoint_id}/revoke:
    post:
      operationId: revokeEndpoint
      parameters:
        - name: endpoint_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Endpoint revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/spaces:
    get:
      operationId: listSpaces
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
      responses:
        "200": { $ref: "#/components/responses/RecordPage" }
    post:
      operationId: createSpace
      parameters:
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpaceCreateCommand"
      responses:
        "201": { description: Space created }
  /v1/spaces/{space_id}:
    get:
      operationId: getSpace
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PrincipalRef"
      responses:
        "200": { $ref: "#/components/responses/CanonicalRecord" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/spaces/{space_id}/members:
    get:
      operationId: listSpaceMembers
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PrincipalRef"
      responses:
        "200": { $ref: "#/components/responses/RecordPage" }
  /v1/spaces/{space_id}/invitations:
    post:
      operationId: createSpaceInvitation
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateCommand"
      responses:
        "202": { description: Invitation created }
  /v1/invitations/{invitation_id}/accept:
    post:
      operationId: acceptInvitation
      parameters:
        - name: invitation_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptCommand"
      responses:
        "202": { description: Invitation accepted }
  /v1/spaces/{space_id}/members/{principal_ref}:
    delete:
      operationId: revokeSpaceMember
      parameters:
        - name: space_id
          in: path
          required: true
          schema: { type: string }
        - name: principal_ref
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/PrincipalRef"
        - $ref: "#/components/parameters/ExpectedVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202": { description: Membership revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ExpectedVersion:
      name: Expected-Version
      in: header
      required: true
      description: Positive Canonical version, for example 3.
      schema:
        type: integer
        minimum: 1
    PrincipalRef:
      name: X-Principal-Ref
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    RuntimeId:
      name: runtime_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        pattern: '^[A-Za-z0-9._:-]+$'
    SpaceId:
      name: X-Space-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 2000
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    AdmissionId:
      name: admission_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    StateId:
      name: state_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ActionId:
      name: action_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
  schemas:
    EndpointPairCommand:
      type: object
      required: [endpoint_ref]
      properties:
        endpoint_ref: { type: string, minLength: 1, maxLength: 255 }
        endpoint_kind: { type: string, minLength: 1, maxLength: 255, default: shadow.endpoint.web }
        label: { type: string, maxLength: 200 }
        capabilities:
          type: array
          items: { type: string, minLength: 1 }
          uniqueItems: true
      unevaluatedProperties: false
    SpaceCreateCommand:
      type: object
      required: [space_id, display_name]
      properties:
        space_id: { type: string, minLength: 1, maxLength: 255 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
      unevaluatedProperties: false
    InvitationCreateCommand:
      type: object
      required: [invitee_ref, role, expires_at]
      properties:
        invitee_ref: { type: string, minLength: 1, maxLength: 255 }
        role: { enum: [editor, viewer] }
        expires_at: { type: string, format: date-time }
      unevaluatedProperties: false
    InvitationAcceptCommand:
      type: object
      required: [invitation_token]
      properties:
        invitation_token: { type: string, minLength: 1, maxLength: 255 }
      unevaluatedProperties: false
    StableId:
      $ref: "../schemas/common/1.0.0/schema.json#/$defs/StableId"
    StableRecordRef:
      $ref: "../schemas/common/1.0.0/schema.json#/$defs/StableRecordRef"
    RecordVersionRef:
      $ref: "../schemas/common/1.0.0/schema.json#/$defs/RecordVersionRef"
    CanonicalEnvelope:
      $ref: "../schemas/kernel/1.0.0/schema.json#/$defs/CanonicalEnvelope"
    ShadowError:
      $ref: "../schemas/execution/1.0.0/schema.json#/$defs/ShadowError"
    HealthResponse:
      type: object
      required: [status, durable]
      properties:
        status:
          enum: [healthy, degraded, unavailable]
        durable:
          type: boolean
      unevaluatedProperties: false
    RuntimeProfile:
      type: object
      required: [runtime_id, display_name, adapter_factory, target_kind, enabled, auto_start, launch, health, workspace_configured]
      properties:
        runtime_id: { type: string }
        display_name: { type: string }
        adapter_factory: { type: string }
        target_kind: { type: string }
        enabled: { type: boolean }
        auto_start: { type: boolean }
        launch:
          type: object
          required: [configured, cwd_configured]
          properties:
            configured: { type: boolean }
            cwd_configured: { type: boolean }
        health:
          type: object
          required: [url_configured]
          properties:
            url_configured: { type: boolean }
        workspace_configured: { type: boolean }
      unevaluatedProperties: false
    RuntimeState:
      type: object
      required: [lifecycle, health, updated_at]
      properties:
        lifecycle: { enum: [stopped, starting, healthy, stopping, failed, unknown] }
        health: { enum: [unknown, healthy, unavailable] }
        pid: { type: integer, nullable: true }
        external_ref: { type: string, nullable: true }
        last_error: { type: object, nullable: true, additionalProperties: true }
        updated_at: { type: string, format: date-time }
      unevaluatedProperties: false
    RuntimeInstance:
      type: object
      required: [runtime_id, active, profile, state, replayed]
      properties:
        runtime_id: { type: string }
        active: { type: boolean }
        profile: { $ref: "#/components/schemas/RuntimeProfile" }
        descriptor: { type: object, nullable: true, additionalProperties: true }
        state: { $ref: "#/components/schemas/RuntimeState" }
        replayed: { type: boolean }
      unevaluatedProperties: false
    RuntimeInstancesResponse:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/RuntimeInstance" }
      unevaluatedProperties: false
    RuntimeMutationResponse:
      type: object
      required: [runtime]
      properties:
        runtime: { $ref: "#/components/schemas/RuntimeInstance" }
      unevaluatedProperties: false
    ManagementOverviewResponse:
      type: object
      required: [api, store, web_ui, active_runtime_id, runtimes, generated_at]
      properties:
        api: { type: object, additionalProperties: true }
        store: { type: object, additionalProperties: true }
        web_ui: { type: object, additionalProperties: true }
        active_runtime_id: { type: string }
        runtimes:
          type: array
          items: { $ref: "#/components/schemas/RuntimeInstance" }
        generated_at: { type: string, format: date-time }
      unevaluatedProperties: false
    CreateConversationCommand:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
      unevaluatedProperties: false
    ConversationTurnSubmission:
      type: object
      required: [submission_id, message_type, content_blocks, turn_mode]
      properties:
        submission_id:
          $ref: "#/components/schemas/StableId"
        message_type:
          type: string
          const: shadow.message.user
        content_blocks:
          type: array
          minItems: 1
          items:
            $ref: "../schemas/profiles/1.0.0/schema.json#/$defs/ContentBlock"
        turn_mode:
          enum: [new, queue-next, cancel-and-replace]
      unevaluatedProperties: false
    CancelRunCommand:
      type: object
      required: [reason_code]
      properties:
        reason_code:
          type: string
          pattern: "^(shadow|[a-z0-9]+(?:[.-][a-z0-9]+)+)\\.[a-z0-9][a-z0-9._-]*$"
      unevaluatedProperties: false
    MemoryCommand:
      type: object
      required: [memory_kind, content_schema_ref, typed_content, applicability_scope, source_dependency]
      properties:
        memory_kind:
          type: string
        content_schema_ref:
          type: string
          format: uri
        typed_content: {}
        applicability_scope:
          type: object
        evidence_refs:
          type: array
          items:
            $ref: "../schemas/profiles/1.0.0/schema.json#/$defs/EvidenceReference"
        source_dependency:
          enum: [independent, dependent, review_required]
      unevaluatedProperties: false
    StateProposalCommand:
      type: object
      required: [input_type, proposed_operation, state_key, value_schema_ref, proposed_value, evidence_refs, source_refs, observed_at, expires_at, source_status]
      properties:
        input_type:
          type: string
          const: shadow.state-proposal
        proposed_operation:
          enum: [create, update, logical_delete]
        target_ref:
          $ref: "#/components/schemas/StableRecordRef"
        expected_version:
          type: integer
          minimum: 1
        state_key:
          type: string
          minLength: 1
          maxLength: 255
        value_schema_ref:
          type: string
          format: uri
        proposed_value: {}
        evidence_refs:
          type: array
          items:
            $ref: "../schemas/state/1.0.0/schema.json#/$defs/EvidenceReference"
        source_refs:
          type: array
          items:
            type: string
        observed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        source_status:
          enum: [available, unavailable, unknown]
        proposal_reason:
          type: string
          maxLength: 4000
      unevaluatedProperties: false
    TaskProposalCommand:
      type: object
      required: [input_type, proposed_operation, task_key, goal, completion_criteria]
      properties:
        input_type:
          type: string
          const: shadow.durable-task-proposal
        proposed_operation:
          enum: [create, activate, wait, pause, resume, completion_pending, complete, fail, cancel]
        target_ref:
          $ref: "#/components/schemas/StableRecordRef"
        expected_version:
          type: integer
          minimum: 1
        task_key:
          type: string
          minLength: 1
          maxLength: 255
        goal:
          type: string
          minLength: 1
          maxLength: 4000
        completion_criteria: {}
        waiting_condition: {}
        deadline:
          type: string
          format: date-time
        result_ref:
          $ref: "#/components/schemas/StableRecordRef"
        failure_summary: {}
        proposal_reason:
          type: string
          maxLength: 4000
      unevaluatedProperties: false
    ActionProposalCommand:
      type: object
      required: [input_type, proposed_operation, action_kind, target_ref, typed_parameters, data_classification, side_effect_level, required_capabilities, deadline, secret_refs]
      properties:
        input_type:
          type: string
          const: shadow.action-proposal
        proposed_operation:
          type: string
          const: create
        action_kind:
          type: string
          minLength: 1
          maxLength: 255
        target_ref:
          $ref: "#/components/schemas/StableRecordRef"
        typed_parameters:
          type: object
        data_classification:
          enum: [public, personal, sensitive]
        side_effect_level:
          enum: [none, low, medium, high]
        required_capabilities:
          type: array
          items:
            type: string
          uniqueItems: true
        deadline:
          type: string
          format: date-time
        secret_refs:
          type: array
          items:
            type: string
          uniqueItems: true
        provider_target_kind:
          type: string
        proposal_reason:
          type: string
          maxLength: 4000
      unevaluatedProperties: false
    ActionApprovalProposalCommand:
      type: object
      required: [input_type, proposed_operation, action_ref, expected_version, approver_ref, decision, evidence_refs]
      properties:
        input_type:
          type: string
          const: shadow.action-approval-proposal
        proposed_operation:
          enum: [approve, reject]
        action_ref:
          $ref: "#/components/schemas/StableRecordRef"
        expected_version:
          type: integer
          minimum: 1
        approver_ref:
          type: string
          minLength: 1
        decision:
          enum: [approved, rejected]
        evidence_refs:
          type: array
          items:
            $ref: "#/components/schemas/StableRecordRef"
        proposal_reason:
          type: string
          maxLength: 4000
      unevaluatedProperties: false
    CheckpointCommand:
      type: object
      required: [checkpoint_kind, checkpoint_digest, runtime_target_kind]
      properties:
        checkpoint_kind:
          enum: [semantic, native, handoff]
        checkpoint_digest:
          type: string
          pattern: "^sha256:[a-f0-9]{64}$"
        runtime_target_kind:
          type: string
        runtime_capabilities:
          type: array
          items:
            type: string
        artifact_refs:
          type: array
          items:
            $ref: "#/components/schemas/StableRecordRef"
        native_resume:
          type: boolean
          default: false
      unevaluatedProperties: false
    CompletionCommand:
      type: object
      properties:
        result_ref:
          $ref: "#/components/schemas/StableRecordRef"
      unevaluatedProperties: false
    GenericInputPayload:
      type: object
      description: Namespaced input payload resolved by an InputHandlerRegistry.
      required: [input_type]
      properties:
        input_type:
          type: string
          minLength: 1
          maxLength: 255
          pattern: "^(shadow|[a-z0-9]+(?:[.-][a-z0-9]+)+)\\.[a-z0-9][a-z0-9._-]*$"
      additionalProperties: true
    ExtensionDescriptor:
      type: object
      required: [extension_id, version, contract_packs, record_types, input_types, execution_target_kinds, capabilities]
      properties:
        extension_id: { type: string }
        version: { type: string }
        contract_packs:
          type: array
          items: { type: string }
        record_types:
          type: array
          items: { type: string }
        input_types:
          type: array
          items: { type: string }
        execution_target_kinds:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
      unevaluatedProperties: false
    ExtensionListResponse:
      type: object
      required: [extensions]
      properties:
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/ExtensionDescriptor"
      unevaluatedProperties: false
    CanonicalRecordResponse:
      type: object
      required: [record]
      properties:
        record:
          $ref: "#/components/schemas/CanonicalEnvelope"
      unevaluatedProperties: false
    RecordPage:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/CanonicalEnvelope"
        next_cursor:
          type: string
          maxLength: 2000
      unevaluatedProperties: false
    WorkAccepted:
      type: object
      required: [admission_ref, message_ref, request_ref, root_run_ref, replayed, durable]
      properties:
        admission_ref:
          $ref: "#/components/schemas/RecordVersionRef"
        message_ref:
          $ref: "#/components/schemas/RecordVersionRef"
        request_ref:
          $ref: "#/components/schemas/RecordVersionRef"
        root_run_ref:
          $ref: "#/components/schemas/RecordVersionRef"
        replayed:
          type: boolean
        durable:
          const: true
      unevaluatedProperties: false
    WorkAcceptedReplay:
      allOf:
        - $ref: "#/components/schemas/WorkAccepted"
        - type: object
          required: [replayed]
          properties:
            replayed:
              const: true
    WorkAcceptedNew:
      allOf:
        - $ref: "#/components/schemas/WorkAccepted"
        - type: object
          required: [replayed]
          properties:
            replayed:
              const: false
    ProposalDecisionResponse:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "../schemas/kernel/1.0.0/schema.json#/$defs/CommitDecision"
        resulting_record_refs:
          type: array
          items:
            $ref: "#/components/schemas/RecordVersionRef"
      unevaluatedProperties: false
    AuthSessionCommand:
      type: object
      required: [credential]
      properties:
        credential: { type: string, minLength: 1, maxLength: 20000 }
        endpoint_ref: { type: string, nullable: true, maxLength: 255 }
        ttl_seconds: { type: integer, minimum: 60, maximum: 86400, default: 3600 }
        use_cookie: { type: boolean, default: true }
      unevaluatedProperties: false
    AuthContext:
      type: object
      required: [principal_ref, issuer, audience, auth_method, authenticated_at, expires_at, session_ref]
      properties:
        principal_ref: { type: string }
        issuer: { type: string }
        audience: { type: string }
        auth_method: { enum: [deterministic, oidc, signed-session] }
        authenticated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        session_ref: { type: string }
        endpoint_ref: { type: string, nullable: true }
        claims_digest: { type: string, nullable: true, pattern: "^sha256:[0-9a-f]{64}$" }
      unevaluatedProperties: false
    AuthConfigResponse:
      type: object
      required: [mode, local_dev, methods, session_cookie]
      properties:
        mode: { enum: [local-dev, oidc, signed-session] }
        local_dev: { type: boolean }
        methods: { type: array, items: { type: string } }
        session_cookie: { type: string }
      unevaluatedProperties: false
    AuthSessionContextResponse:
      type: object
      required: [context]
      properties:
        context: { $ref: "#/components/schemas/AuthContext" }
      unevaluatedProperties: false
    AuthSessionResponse:
      type: object
      required: [session, context, token, replayed]
      properties:
        session: { $ref: "#/components/schemas/CanonicalEnvelope" }
        context: { $ref: "#/components/schemas/AuthContext" }
        token: { type: string }
        replayed: { type: boolean }
      unevaluatedProperties: false
    AuthLogoutResponse:
      type: object
      required: [session, replayed]
      properties:
        session: { $ref: "#/components/schemas/CanonicalEnvelope" }
        replayed: { type: boolean }
      unevaluatedProperties: false
  responses:
    RecordPage:
      description: Canonical records visible in the caller context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RecordPage"
    CanonicalRecord:
      description: Canonical record visible in the caller context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CanonicalRecordResponse"
    ValidationError:
      description: Input or Profile validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ShadowError"
    Conflict:
      description: Expected Version or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ShadowError"
    Forbidden:
      description: Policy or authority denied the operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ShadowError"
    Unauthorized:
      description: Authentication is missing, invalid, expired or revoked
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ShadowError"
    NotFound:
