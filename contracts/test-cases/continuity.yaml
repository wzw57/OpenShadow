  - case_id: continuity.checkpoint.valid
    requirement_level: must
    input_fixture_refs: [../fixtures/continuity/valid-checkpoint.json]
    expected_outcome: valid
  - case_id: continuity.trigger.valid
    requirement_level: must
    input_fixture_refs: [../fixtures/continuity/valid-trigger-observation.json]
