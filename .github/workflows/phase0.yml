name: phase0-1

on:
  push:
    branches: [main, "stage5/**"]
  pull_request:

jobs:
  contract-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check packages/shadow-kernel/src packages/shadow-application/src adapters/test-deterministic/src apps/shadow-server tests
      - run: pytest -q
